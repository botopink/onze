# Per-platform CI for onze.
#
# onze is a backend mocking lib — exercised on every viable target. Matrix:
# `{ubuntu, macos} × {commonJS, erlang, beam, wasm}` plus
# `windows × commonJS` (escript/wasmtime don't ship cleanly on the windows
# runner in v0.18; reinstate when shimmed).
name: test

on:
  push:
    branches: [feat, master, main]
  pull_request:
    branches: [feat, master, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_NAME: onze
  BOTOPINK_LANG_REPO: botopink/botopink-lang

jobs:
  test:
    name: ${{ matrix.runner }} · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: commonJS }
          - { runner: ubuntu-22.04, target: erlang   }
          - { runner: ubuntu-22.04, target: beam     }
          - { runner: ubuntu-22.04, target: wasm     }
          - { runner: macos-14,     target: commonJS }
          - { runner: macos-14,     target: erlang   }
          - { runner: macos-14,     target: beam     }
          - { runner: macos-14,     target: wasm     }
          - { runner: windows-2022, target: commonJS }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this lib
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout botopink-lang
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BOTOPINK_LANG_REPO }}
          ref: ${{ vars.BOTOPINK_LANG_REF || 'main' }}
          path: botopink-lang

      - name: Place lib under botopink-lang/repository/${{ env.LIB_NAME }}/
        shell: bash
        run: |
          mkdir -p botopink-lang/repository
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete self/ "botopink-lang/repository/${LIB_NAME}/"
          else
            rm -rf "botopink-lang/repository/${LIB_NAME}"
            cp -R self "botopink-lang/repository/${LIB_NAME}"
          fi

      - name: Install erlang (linux)
        if: matrix.runner == 'ubuntu-22.04' && (matrix.target == 'erlang' || matrix.target == 'beam')
        run: sudo apt-get update -y && sudo apt-get install -y erlang

      - name: Install erlang (macos)
        if: matrix.runner == 'macos-14' && (matrix.target == 'erlang' || matrix.target == 'beam')
        run: brew install erlang

      - name: Install wasmtime (linux + macos)
        if: matrix.target == 'wasm'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Install Node 20
        if: matrix.target == 'commonJS'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: zig build install
        working-directory: botopink-lang
        run: zig build install

      - name: zig build test-libs --lib onze --target ${{ matrix.target }}
        working-directory: botopink-lang
        run: zig build test-libs -- --lib "${LIB_NAME}" --target "${{ matrix.target }}"
